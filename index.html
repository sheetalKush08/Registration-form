<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(rgb(138, 223, 229),rgb(239, 97, 194));
        }
        .form-wrapper {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border: 2px solid #0c0c0c;
            border-radius: 5px;
            background-color: rgb(214, 227, 243);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 2px;
            border: #0c0c0c;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #0a0a0a;
            border-radius: 4px;
        }
        .form-group button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            background-color: rgb(50, 16, 162);
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-wrapper">
    <form id="registrationForm" action="connection.php" method="POST">
        <h2 style="text-align: center;">REGISTRATION FORM</h2>
        <div class="form-group">
            <label for="name">First Name:</label>
            <input type="text" placeholder="First Name" id="name" name="fname" maxlength="10" required>
        </div>
        <div class="form-group">
            <label for="name">Middle Name:</label>
            <input type="text" placeholder="Middle Name" id="name" name="mname" maxlength="10">
        </div>
        <div class="form-group">
            <label for="name">Last Name:</label>
            <input type="text"  placeholder="Last Name" id="name" name="lname" maxlength="'10" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email"placeholder="Email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div>
        <div class="form-group">
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Please select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <div class="arrow"></div>
        </div>
        <div class="form-group">
            <label for="occupation">Occupation</label>
            <select id="occupation" name="occupation" required>
                <option value=" " >Select your profession</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="professional">Professional</option>
                <option value="freelancer">Freelancer</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="area of interest">Area of Interest</label>
            <select id="area of interest" name="areaofinterest" required>
                <option value="">Choose your area of interest</option>
                <option value="computer science & tech">Computer Science & Tech</option>
                <option value="digital marketing & business">Digital Marketing & Business</option>
                <option value="finance & investing">Finance & Investing</option>
                <option value="management & leadership">Management & Leadership</option>
                <option value="self-development">Self-Development</option>
            </select>
        </div>
        <div class="form-group">
            <label for="mobile">Mobile Number:</label>
            <input type="tel" placeholder="Mobile no" id="mobile" name="mobile" pattern="\d{10}" maxlength="10" minlength="10" required>
        </div>
        <div class="form-group">
            <label for="address">Address:</label>
            <input type="address" placeholder="Address" id="address" name="address" maxlength="30">

        </div>
        <div class="form-group">
            <label for="country">Country:</label>
            <input type="text" placeholder="Country" id="country" name="country" required>
        </div>
        <div class="form-group">
            <button type="submit" name="submit">Submit</button>
            <button type="reset" name="reset">Reset</button>
        </div>
    </form>
</div>

<script>
    function validateEmail(email)
    {
        const re=/\S+@\S+\.S+/;
        return re.test(email);
    }
    const email="example@email.com";
    if(validateEmail(email))
    {
        console.log("Valid email address");

    }
    else
    {
        console.log("Invalid email address");
    }
    // document.getElementById('registrationForm').addEventListener('submit', function(event) 
    // {
    //     event.preventDefault(); // Prevent the default form submit action
    //     alert('Form successfully submitted');
    //     // Here, you could also implement functionality to send form data to a server
    // });

    document.getElementById('registrationForm').addEventListener('reset', function() {
        alert('Form successfully reset');
    });
</script>

</footer>

</body>
</html>
